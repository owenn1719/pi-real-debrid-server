services:
  discover:
    build:
      context: .
      dockerfile: Dockerfile.discover
    image: pi-infuse-discover:local
    container_name: discover
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./test-catalog:/catalog
    environment:
      DISCOVER_ZURG_CONFIG: /app/config.yml
      DISCOVER_COMET_URL: https://comet.feels.legal/
      DISCOVER_HOST: 0.0.0.0
      DISCOVER_PORT: 8090
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN}
      DISCOVER_CATALOG_PATH: /catalog
      DISCOVER_PUBLIC_URL: ${DISCOVER_PUBLIC_URL:-http://192.168.4.58:8090}
      DISCOVER_SYNC_INTERVAL_SECONDS: 43200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest    
    container_name: zurg
    restart: unless-stopped
    ports:
      - 9999:9999
    volumes:
      - ./scripts/plex_update.sh:/app/plex_update.sh
      - ./config.yml:/app/config.yml
      - zurgdata:/app/data

  rclone:
    build:
      context: .
      dockerfile: Dockerfile.rclone-zurg
    image: pi-rclone-zurg:1.74.3-rmdir501-1
    container_name: rclone
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PUID: 1000
      PGID: 1000
    volumes:
      - /mnt/zurg:/data:rshared # CHANGE /mnt/zurg WITH YOUR PREFERRED MOUNT PATH
      - ./rclone.conf:/config/rclone/rclone.conf
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    depends_on:
      - zurg
    command: "mount zurg: /data --allow-other --allow-non-empty --dir-cache-time 10s --vfs-cache-mode full --vfs-cache-max-size 8G --vfs-cache-max-age 1h"

  webdav:
    image: rclone/rclone:latest
    container_name: webdav
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - /mnt/zurg:/data:rshared
    depends_on:
      - rclone
    command: >
      serve webdav /data
      --addr :8080
      --user oarters
      --pass ${WEBDAV_PASSWORD}
      --dir-cache-time 5s
      --poll-interval 0

  discover-webdav:
    image: rclone/rclone:latest
    container_name: discover-webdav
    restart: unless-stopped
    ports:
      - 8091:8091
    volumes:
      - ./test-catalog:/data:ro
    command: >
      serve webdav /data
      --addr :8091
      --user oarters
      --pass ${WEBDAV_PASSWORD}
      --dir-cache-time 5s
      --poll-interval 0
volumes:
  zurgdata:
